overview:
  checked: 2026-09-26
  text:
    ar: >-
      يهدف المقياس إلى تحسين اللغة الإنجليزية من خلال تعلّم كتابة مخطط أعمال وعرضه. يتناول ثمانية محاور: الملخص التنفيذي،
      ووصف المؤسسة، وتحليل السوق وخطة التسويق، وخطة الإدارة، والمتطلبات التشغيلية والمراجعة التقنية، وخطة الإنتاج،
      والخطة المالية، وتحليل المخاطر.
    fr: >-
      Le module vise à améliorer l’anglais en apprenant à rédiger et présenter un business plan. Il couvre huit thèmes :
      résumé exécutif, description de l’entreprise, analyse de marché et plan marketing, plan de management, exigences
      opérationnelles et revue technique, plan de production, plan financier et analyse des risques.
    en: >-
      The module improves English while teaching how to write and present a business plan. It covers eight topics: the
      executive summary, description of the business, market analysis and marketing plan, management plan, operational
      requirements and technical review, production plan, financial plan, and risk analysis.
