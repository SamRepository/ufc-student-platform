# Static site server. Coolify terminates TLS and routes the subdomain to port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;   # keep redirects relative behind Coolify's proxy
    charset utf-8;
    charset_types application/json text/css application/javascript;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;   # HTML/JSON: always revalidate so content updates show at once

    # Fingerprinted build assets never change.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"live"}';
    }

    # Ready when the built site (release identifier) is present.
    location = /health/ready {
        access_log off;
        default_type application/json;
        try_files /release.json =503;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
